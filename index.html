<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: #fff;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 180px;
    flex-shrink: 0;
    background: #050505;
    border-right: 2px solid #ffffff22;
    padding: 30px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sidebar .logo {
    font-size: 22px;
    padding: 0 20px 20px 20px;
    letter-spacing: 1px;
  }

  .nav-btn {
    background: none;
    border: none;
    color: #aaa;
    font-family: inherit;
    font-size: 17px;
    text-align: left;
    padding: 14px 20px;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    border-left: 3px solid transparent;
  }

  .nav-btn:hover {
    color: #fff;
  }

  .nav-btn.active {
    color: #fff;
    background: #ffffff0d;
    border-left: 3px solid #fff;
    box-shadow: inset 0 0 12px #ffffff22;
  }

  /* ---------- Main content ---------- */
  .main {
    flex: 1;
    padding: 50px 60px;
    overflow-x: hidden;
  }

  .view { display: none; }
  .view.active { display: block; }

  h1.hero-title {
    font-size: 40px;
    margin-bottom: 6px;
  }

  p.tagline {
    color: #999;
    font-size: 16px;
    margin-bottom: 40px;
  }

  .games-label {
    position: absolute;
    top: 14px;
    right: 24px;
    font-size: 13px;
    color: #888;
    letter-spacing: 0.5px;
    z-index: 5;
    background: #000;
    padding: 2px 6px;
  }

  #view-games {
    position: relative;
  }

  #view-games .carousel-wrap {
    margin-top: 4px;
  }

  /* ---------- Game grid (Home) ---------- */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 28px;
    max-width: 900px;
    align-items: start;
  }

  .game-card {
    background: #0a0a0a;
    border: 2px solid #ffffff33;
    border-radius: 10px;
    padding: 0 0 14px 0;
    text-align: center;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .game-card:hover {
    transform: scale(1.08);
    border-color: #fff;
    box-shadow: 0 0 12px 2px #fff, 0 0 30px 6px #ffffffaa;
    position: relative;
    z-index: 2;
  }

  .thumb {
    width: 100%;
    aspect-ratio: 4 / 5;
    background: linear-gradient(135deg, #1a1a1a, #262626);
    border-radius: 0;
    margin-bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 13px;
    overflow: hidden;
    position: relative;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .thumb-fallback {
    display: none;
    align-items: center;
    justify-content: center;
  }

  .game-card h3 {
    font-size: 18px;
    font-weight: normal;
    margin-top: 12px;
    padding: 0 10px;
  }

  /* ---------- Games view (bigger thumbnails + carousel) ---------- */
  .carousel-wrap {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    max-width: 100%;
    margin-top: 10px;
  }

  .carousel-track {
    display: flex;
    align-items: flex-start;
    gap: 32px;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding: 6px 4px 34px 4px;
    flex: 1;
    min-width: 0;
    scrollbar-color: #ffffff88 #111;
    scrollbar-width: thin;
  }

  .carousel-track::-webkit-scrollbar {
    height: 10px;
  }

  .carousel-track::-webkit-scrollbar-track {
    background: #111;
    border-radius: 6px;
  }

  .carousel-track::-webkit-scrollbar-thumb {
    background: #ffffff88;
    border-radius: 6px;
    border: 2px solid #111;
  }

  .carousel-track::-webkit-scrollbar-thumb:hover {
    background: #fff;
  }

  .carousel-track .game-card {
    flex: 0 0 340px;
  }

  .carousel-track .thumb {
    font-size: 16px;
  }

  .carousel-track h3 {
    font-size: 21px;
  }

  .carousel-arrow {
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 12px;
    background: #0a0a0a;
    border: 2px solid #ffffff55;
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .carousel-arrow:hover {
    border-color: #fff;
    box-shadow: 0 0 10px 2px #fff;
  }

  /* ---------- Game detail view ---------- */
  .detail-back {
    background: none;
    border: 2px solid #ffffff44;
    color: #ccc;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 30px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .detail-back:hover {
    border-color: #fff;
    color: #fff;
  }

  .detail-layout {
    display: flex;
    gap: 40px;
    max-width: 900px;
    flex-wrap: wrap;
  }

  .detail-thumb {
    width: 320px;
    height: 220px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #1a1a1a, #262626);
    border: 2px solid #ffffff33;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 15px;
    overflow: hidden;
    position: relative;
  }

  .detail-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }

  .detail-info {
    flex: 1;
    min-width: 260px;
  }

  .detail-info h2 {
    font-size: 30px;
    margin-bottom: 14px;
  }

  .detail-info p.desc {
    color: #bbb;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .meta-row {
    display: flex;
    gap: 30px;
    border-top: 1px solid #ffffff22;
    padding-top: 16px;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .meta-item span.label {
    color: #777;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .meta-item span.value {
    font-size: 16px;
  }

  /* ---------- Mobile responsiveness ---------- */
  @media (max-width: 700px) {
    .sidebar {
      width: 64px;
      padding: 16px 0;
    }

    .sidebar .logo {
      font-size: 13px;
      padding: 0 8px 14px 8px;
    }

    .nav-btn {
      font-size: 13px;
      padding: 10px 8px;
    }

    .main {
      padding: 24px 16px;
    }

    h1.hero-title {
      font-size: 28px;
    }

    .games-label {
      top: 8px;
      right: 12px;
      font-size: 11px;
    }

    .game-grid {
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px;
    }

    .carousel-track .game-card {
      flex: 0 0 62vw;
    }

    .carousel-arrow {
      width: 34px;
      height: 34px;
      font-size: 15px;
    }

    .detail-thumb {
      width: 100%;
      max-width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
    }

    .detail-layout {
      gap: 20px;
    }
  }
</style>
</head>
<body>

  <div class="sidebar">
    <div class="logo">Games</div>
    <button class="nav-btn active" data-view="home" onclick="showView('home')">Home</button>
    <button class="nav-btn" data-view="games" onclick="showView('games')">Games</button>
  </div>

  <div class="main">

    <!-- HOME VIEW -->
    <section id="view-home" class="view active">
      <h1 class="hero-title">Games</h1>
    </section>

    <!-- GAMES VIEW -->
    <section id="view-games" class="view">
      <div class="carousel-wrap">
        <button class="carousel-arrow left" onclick="scrollCarousel(-1)">&#10094;</button>
        <div class="carousel-track" id="games-track" tabindex="0"></div>
        <button class="carousel-arrow right" onclick="scrollCarousel(1)">&#10095;</button>
      </div>
    </section>

    <!-- GAME DETAIL VIEW -->
    <section id="view-detail" class="view">
      <button class="detail-back" onclick="showView('games')">&#8592; Back to games</button>
      <div class="detail-layout">
        <div class="detail-thumb" id="detail-thumb">
          <img id="detail-img" src="" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <span class="thumb-fallback">thumbnail</span>
        </div>
        <div class="detail-info">
          <h2 id="detail-title"></h2>
          <p class="desc" id="detail-desc"></p>
          <div class="meta-row">
            <div class="meta-item">
              <span class="label">Storage</span>
              <span class="value" id="detail-storage"></span>
            </div>
            <div class="meta-item">
              <span class="label">Release date</span>
              <span class="value" id="detail-date"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

  </div>

<script>
  const games = [
    { id: "10minutestilldawn", title: "10 Minutes Till Dawn" },
    { id: "1v1lol", title: "1v1.LOL" },
    { id: "amandatheadventurer", title: "Amanda the Adventurer" },
    { id: "backrooms", title: "Backrooms" },
    { id: "badparenting", title: "Bad Parenting" },
    { id: "baldisbasics", title: "Baldi's Basics" },
    { id: "bankrobbery1", title: "Bank Robbery" },
    { id: "bankrobbery2", title: "Bank Robbery 2" },
    { id: "bankrobbery3", title: "Bank Robbery 3" },
    { id: "baseballbros", title: "Baseball Bros" },
    { id: "basketballstars", title: "Basketball Stars" },
    { id: "basketbros", title: "Basket Bros" },
    { id: "basketrandom", title: "Basket Random" },
    { id: "bendy", title: "Bendy and the Ink Machine" },
    { id: "bindingofisaac", title: "The Binding of Isaac" },
    { id: "bitlife", title: "BitLife" },
    { id: "bitplanes", title: "Bit Planes" },
    { id: "blockblast", title: "Block Blast" },
    { id: "bottlejump3d", title: "Bottle Jump 3D" },
    { id: "bouncemasters", title: "Bouncemasters" },
    { id: "boxingrandom", title: "Boxing Random" },
    { id: "buckshotroulette", title: "Buckshot Roulette" },
    { id: "buildnow", title: "Build Now GG" },
    { id: "cookieclicker", title: "Cookie Clicker" },
    { id: "coreball", title: "Core Ball" },
    { id: "crossyroad", title: "Crossy Road" },
    { id: "cuphead", title: "Cuphead" },
    { id: "cuttherope", title: "Cut the Rope" },
    { id: "doodlebaseball", title: "Doodle Baseball" }, 
    { id: "doodlejump", title: "Doodle Jump" },
    { id: "doom1", title: "DOOM" },
    { id: "doom2", title: "DOOM II" },
    { id: "doom3", title: "DOOM 3" },
    { id: "driftboss", title: "Drift Boss" },
    { id: "drifthunters", title: "Drift Hunters" },
    { id: "endoparasitic1", title: "Endoparasitic" },
    { id: "endoparasitic2", title: "Endoparasitic 2" },
    { id: "escaperoad1", title: "Escape Road" },
    { id: "escaperoad2", title: "Escape Road 2" },
    { id: "escaperoad3", title: "Escape Road 3" },
    { id: "fallout", title: "Fallout" },
    { id: "fearstofathom", title: "Fears to Fathom" },
    { id: "ffps", title: "Freddy Fazbear's Pizzeria Simulator" },
    { id: "flappybird", title: "Flappy Bird" },
    { id: "fnac1", title: "Five Nights at Candy's" },
    { id: "fnac2", title: "Five Nights at Candy's 2" },
    { id: "fnaf1", title: "Five Nights at Freddy's" },
    { id: "fnaf2", title: "Five Nights at Freddy's 2" },
    { id: "fnaf3", title: "Five Nights at Freddy's 3" },
    { id: "fnaf4", title: "Five Nights at Freddy's 4" },
    { id: "fnaf4halloween", title: "Five Nights at Freddy's 4: Halloween Edition" },
    { id: "fnafsl", title: "Five Nights at Freddy's: Sister Location" },
    { id: "footballbros", title: "Football Bros" },
    { id: "fruitninja", title: "Fruit Ninja" },
    { id: "gag", title: "Grow a Garden" },
    { id: "geometrydash", title: "Geometry Dash" },
    { id: "gettingoverit", title: "Getting Over It" },
    { id: "granny1", title: "Granny" },
    { id: "granny2", title: "Granny 2" },
    { id: "granny3", title: "Granny 3" },
    { id: "halflife", title: "Half-Life" },
    { id: "hillclimbracing", title: "Hill Climb Racing" },
    { id: "hollowknight", title: "Hollow Knight" },
    { id: "ironlung", title: "Iron Lung" },
    { id: "jellydrift", title: "Jelly Drift" },
    { id: "jetpackjoyride", title: "Jetpack Joyride" },
    { id: "johnnytrigger", title: "Johnny Trigger" },
    { id: "kindergarten1", title: "Kindergarten" },
    { id: "kindergarten2", title: "Kindergarten 2" },
    { id: "kindergarten3", title: "Kindergarten 3" },
    { id: "learntofly3", title: "Learn to Fly 3" },
    { id: "melonplayground", title: "Melon Playground" },
    { id: "motox3m", title: "Moto X3M" },
    { id: "nazizombies", title: "Nazi Zombies" },
    { id: "omori", title: "OMORI" },
    { id: "ovo", title: "OvO" },
    { id: "papersplease", title: "Papers, Please" },
    { id: "peggle", title: "Peggle" },
    { id: "pixelgun", title: "Pixel Gun 3D" },
    { id: "plantsvszombies1", title: "Plants vs. Zombies" },
    { id: "plantsvszombies2", title: "Plants vs. Zombies 2" },
    { id: "pokemon", title: "Pokémon" },
    { id: "raft", title: "Raft" },
    { id: "ragdollarchers", title: "Ragdoll Archers" },
    { id: "ragdollhit", title: "Ragdoll Hit" },
    { id: "repo", title: "R.E.P.O." },
    { id: "retrobowl", title: "Retro Bowl" },
    { id: "retrobowlcollege", title: "Retro Bowl College" },
    { id: "schoolboyrunaway", title: "Schoolboy Runaway" },
    { id: "silksong", title: "Hollow Knight: Silksong" },
    { id: "slenderman", title: "Slender Man" },
    { id: "slimerancher", title: "Slime Rancher" },
    { id: "ucn", title: "Ultimate Custom Night" }
  ].map(g => ({
    ...g,
    desc: "Description coming soon.",
    storage: "—",
    date: "—"
  }));

  function renderCard(game) {
    const card = document.createElement("div");
    card.className = "game-card";
    card.onclick = () => showDetail(game.id);
    card.innerHTML = `
      <div class="thumb">
        <img src="thumbnails/${game.id}.png" alt="${game.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="thumb-fallback">thumbnail</span>
      </div>
      <h3>${game.title}</h3>
    `;
    return card;
  }

  function renderGrids() {
    const gamesTrack = document.getElementById("games-track");
    gamesTrack.innerHTML = "";
    games.forEach(game => {
      gamesTrack.appendChild(renderCard(game));
    });
  }

  function showView(view) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + view).classList.add("active");
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    const navBtn = document.querySelector(`.nav-btn[data-view="${view}"]`);
    if (navBtn) navBtn.classList.add("active");
  }

  function showDetail(id) {
    const game = games.find(g => g.id === id);
    if (!game) return;
    document.getElementById("detail-title").textContent = game.title;
    document.getElementById("detail-desc").textContent = game.desc;
    document.getElementById("detail-storage").textContent = game.storage;
    document.getElementById("detail-date").textContent = game.date;
    const img = document.getElementById("detail-img");
    img.style.display = "block";
    img.src = "thumbnails/" + game.id + ".png";
    img.alt = game.title;
    document.querySelector("#detail-thumb .thumb-fallback").style.display = "none";
    showView("detail");
  }

  function scrollCarousel(direction) {
    const track = document.getElementById("games-track");
    track.scrollBy({ left: direction * 300, behavior: "smooth" });
  }

  document.addEventListener("keydown", (e) => {
    const gamesView = document.getElementById("view-games");
    if (!gamesView.classList.contains("active")) return;
    if (e.key === "ArrowLeft") scrollCarousel(-1);
    if (e.key === "ArrowRight") scrollCarousel(1);
  });

  renderGrids();
</script>

</body>
</html>
